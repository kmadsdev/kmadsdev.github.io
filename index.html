<!doctype html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Each word in double braces is a value from src/content/content.js. scripts/index-html.mjs fills them when Vite serves or builds the page. LanguageProvider.jsx sets the text again at run time. -->
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="{{author}}" />
    <meta name="theme-color" content="#0B0B10" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="{{page}}" />
    <link rel="alternate" hreflang="en" href="{{pageEn}}" />
    <link rel="alternate" hreflang="pt-BR" href="{{pagePt}}" />
    <link rel="alternate" hreflang="x-default" href="{{page}}" />
    <link rel="icon" type="image/png" href="{{favicon}}" />
    <link rel="apple-touch-icon" href="{{favicon}}" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{siteName}}" />
    <meta property="og:url" content="{{page}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:locale:alternate" content="{{ogLocaleAlternate}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImage}}" />

    <script type="application/ld+json">
    {{jsonLd}}
    </script>
    <!-- Sets the saved language before the first paint. -->
    <script>
        (function () {
            try {
                var root = document.documentElement;
                var lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('kmads.lang') || navigator.language || '';
                if (lang.toLowerCase().slice(0, 2) === 'pt') root.lang = 'pt-BR';
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <noscript>
        <div style="max-width: 640px; margin: 80px auto; padding: 0 24px; font-family: system-ui, sans-serif; color: #eee; background: #0B0B10;">
            <h1>{{noscriptTitle}}</h1>
            <p>{{noscriptEn}}</p>
            <p>{{noscriptPt}}</p>
            <p><a href="{{emailHref}}" style="color: #ff5c8a;">{{email}}</a> · <a href="{{github}}" style="color: #ff5c8a;">{{githubLabel}}</a> · <a href="{{linkedin}}" style="color: #ff5c8a;">{{linkedinLabel}}</a></p>
        </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
